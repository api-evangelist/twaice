aid: twaice
name: Twaice
description: >-
  TWAICE (TWAICE Technologies GmbH) is a Munich-based battery analytics software
  company. Its predictive analytics platform turns BMS data from battery energy
  storage systems (BESS) and electric-vehicle fleets into actionable insights for
  performance management, warranty management, safety monitoring, digital
  commissioning, and BESS reporting, alongside a battery simulation model library
  for engineers. Customers include BESS asset owners and operators, IPPs,
  utilities, automotive and bus/truck OEMs, and battery manufacturers. TWAICE is
  ISO 27001 certified, holds the automotive TISAX label, and is backed by
  investors including Creandum and Speedinvest. It publishes no public API or
  developer program; the platform is a closed SaaS.
